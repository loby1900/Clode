name: Build XFONX Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend URL to bake into this build (overrides the XFONX_BACKEND_URL repo variable)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Sync Capacitor (bake in backend URL)
        working-directory: app
        env:
          XFONX_BACKEND_URL: ${{ inputs.backend_url || vars.XFONX_BACKEND_URL }}
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        working-directory: app/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        run: echo "path=app/android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: xfonx-debug-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Create/update GitHub Release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: XFONX — آخر نسخة APK
          body: |
            آخر بناء تلقائي لتطبيق XFONX لأندرويد (نسخة debug، صالحة للتثبيت المباشر).
            تم بناؤه من commit: ${{ github.sha }}
          files: ${{ steps.apk.outputs.path }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
